<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot to Task Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #a78bfa;
        }

        p.subtitle {
            color: #888;
            margin-bottom: 32px;
        }

        /* ── Upload Box ── */
        .upload-box {
            border: 2px dashed #333;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 16px;
        }

        .upload-box:hover {
            border-color: #a78bfa;
        }

        .upload-box input[type="file"] {
            display: none;
        }

        .upload-box label {
            cursor: pointer;
            font-size: 1rem;
            color: #888;
        }

        .upload-box label span {
            color: #a78bfa;
            font-weight: bold;
        }

        /* ── Preview Image ── */
        #preview {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
        }

        /* ── Button ── */
        button {
            width: 100%;
            padding: 14px;
            background: #a78bfa;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 24px;
        }

        button:hover {
            background: #7c3aed;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        /* ── Results ── */
        #results {
            display: none;
        }

        .task-list {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 24px;
        }

        .task-list h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #a78bfa;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #a78bfa;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .task-item label {
            font-size: 0.95rem;
            color: #ddd;
            line-height: 1.5;
        }

        .no-tasks {
            color: #888;
            font-size: 0.9rem;
        }

        /* ── Loading ── */
        #loading {
            display: none;
            text-align: center;
            color: #888;
            margin-bottom: 16px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Screenshot to Task Tool ✦</h1>
        <p class="subtitle">Upload any screenshot — AI will extract actionable tasks instantly.</p>

        <!-- Upload Area -->
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
            <label>
                Click to upload a screenshot or drag & drop<br>
                <span>PNG, JPG, JPEG supported</span>
            </label>
        </div>

        <!-- Image Preview -->
        <img id="preview" alt="Preview">

        <!-- Extract Button -->
        <button id="extractBtn" onclick="extractTasks()" disabled>
            Extract Tasks with AI
        </button>

        <!-- Loading Spinner -->
        <div id="loading">
            <span class="spinner"></span> AI is reading your screenshot...
        </div>

        <!-- Results -->
        <div id="results">
            <div class="task-list">
                <h2>📋 Extracted Tasks</h2>
                <div id="taskItems"></div>
            </div>
        </div>
    </div>

    <script>
        // ── Show image preview when user selects a file ──
        // Why? Good UX — user should see what they uploaded
        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const preview = document.getElementById("preview");
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";

            // Enable the button only after a file is selected
            document.getElementById("extractBtn").disabled = false;
        }

        // ── Send image to Flask backend ──
        async function extractTasks() {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];
            if (!file) return;

            // Show loading, hide results
            document.getElementById("loading").style.display = "block";
            document.getElementById("results").style.display = "none";
            document.getElementById("extractBtn").disabled = true;

            // Why FormData? It's the standard way to send files
            // over HTTP from a browser to a server
            const formData = new FormData();
            formData.append("screenshot", file);

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                // Hide loading
                document.getElementById("loading").style.display = "none";
                document.getElementById("extractBtn").disabled = false;

                // Display tasks
                displayTasks(data.tasks);

            } catch (error) {
                document.getElementById("loading").style.display = "none";
                document.getElementById("extractBtn").disabled = false;
                alert("Something went wrong. Please try again.");
            }
        }

        // ── Render tasks as checkboxes ──
        function displayTasks(tasks) {
            const container = document.getElementById("taskItems");
            const results = document.getElementById("results");

            container.innerHTML = "";

            if (!tasks || tasks.length === 0) {
                container.innerHTML = '<p class="no-tasks">No tasks found in this screenshot.</p>';
            } else {
                tasks.forEach((task, index) => {
                    container.innerHTML += `
                        <div class="task-item">
                            <input type="checkbox" id="task${index}">
                            <label for="task${index}">${task}</label>
                        </div>
                    `;
                });
            }

            results.style.display = "block";
        }
    </script>
</body>
</html>
